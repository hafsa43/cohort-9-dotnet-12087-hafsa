# =====================================================================
# SonarQube Project Configuration
# Project: Task Management Tool (.NET Core 9 + React 19)
# =====================================================================

# Project Identification
sonar.projectKey=TaskManagementSystem
sonar.projectName=Task Management System (.NET Core & React)
sonar.projectVersion=1.0

# Source Code Encoding
sonar.sourceEncoding=UTF-8

# Source Code & Test Directories
sonar.sources=TaskManagement.API,TaskManagement.Application,TaskManagement.Domain,TaskManagement.Infrastructure,task-management-ui/src
sonar.tests=TaskManagement.Tests

# File Exclusions (Ignore Generated & Third-Party Code)
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/build/**,**/Migrations/**,**/coverage/**,**/*.designer.cs,**/*.Designer.cs
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,**/TaskManagement.Tests/**,**/*.spec.js,**/*.test.jsx,**/*.test.js

# C# (.NET Core) Test Reports & Code Coverage Paths
sonar.cs.vstest.reportsPaths=**/*.trx
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# JavaScript / React Frontend Coverage Report Path
sonar.javascript.lcov.reportPaths=task-management-ui/coverage/lcov.info

# Quality Gate Enforcement
sonar.qualitygate.wait=false
